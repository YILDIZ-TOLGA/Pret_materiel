# Tout le projet en une commande :   docker compose up -d --build
#   Site             → http://localhost:3000
#   Boîte mail test  → http://localhost:8025  (tous les e-mails envoyés par le site arrivent ici)
# Les réglages se changent dans le fichier .env (facultatif, voir .env.example).
# Mise en ligne sur un serveur : voir docker-compose.prod.yml (HTTPS avec Caddy, sans Mailpit).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pret
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pret}
      POSTGRES_DB: pret
    # accessible seulement depuis ta machine (pgAdmin, DBeaver, npm run dev…)
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pret -d pret"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      args:
        APP_URL: ${APP_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      # port d'écoute dans le conteneur (le Dockerfile lit PORT, que fournissent les hébergeurs comme Railway)
      PORT: "3000"
      DATABASE_URL: postgresql://pret:${DB_PASSWORD:-pret}@db:5432/pret
      APP_URL: ${APP_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-change-moi-avant-de-mettre-en-ligne}
      CRON_SECRET: ${CRON_SECRET:-change-moi-cron}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@pret.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin1234}
      # Par défaut les e-mails partent dans Mailpit (boîte de test). Mets ton vrai SMTP dans .env.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Prêt Matériel <no-reply@pret.local>}
      # Sans clés Stripe : true = les offres s'activent sans payer (pour tester)
      DEMO_BILLING: ${DEMO_BILLING:-true}
    # accessible seulement depuis ta machine ; en ligne, c'est Caddy qui reçoit le trafic (docker-compose.prod.yml)
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"

  # Boîte mail de test : http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_SMTP_BIND_ADDR: 0.0.0.0:587
    # jamais exposée sur Internet : elle contient tous les e-mails, liens de mot de passe compris
    ports:
      - "127.0.0.1:8025:8025"

  # Sauvegarde de la base chaque jour dans le dossier ./sauvegardes (une copie par jour, gardée BACKUP_DAYS jours).
  # Restaurer : voir le README, partie « Sauvegardes ». Pense à copier ce dossier hors du serveur.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: pret
      PGPASSWORD: ${DB_PASSWORD:-pret}
      PGDATABASE: pret
      # durée affichée dans la politique de confidentialité (RETENTION.backupDays, src/lib/legal.ts)
      BACKUP_DAYS: ${BACKUP_DAYS:-14}
    volumes:
      - ./sauvegardes:/sauvegardes
    entrypoint: ["sh", "-c", "while true; do f=/sauvegardes/pret-$$(date +%Y%m%d-%H%M).dump; if pg_dump -Fc -f $$f.tmp; then mv $$f.tmp $$f; echo \"Sauvegarde : $$f\"; else rm -f $$f.tmp; echo 'ÉCHEC de la sauvegarde'; fi; find /sauvegardes -name 'pret-*.dump' -mtime +$$BACKUP_DAYS -delete; sleep 86400; done"]

  # Rappels automatiques : appelle /api/cron/reminders toutes les heures
  cron:
    image: curlimages/curl:latest
    restart: unless-stopped
    depends_on: [app]
    environment:
      CRON_SECRET: ${CRON_SECRET:-change-moi-cron}
    entrypoint: ["sh", "-c", "sleep 60; while true; do curl -s -H \"Authorization: Bearer $$CRON_SECRET\" http://app:3000/api/cron/reminders; echo; sleep 3600; done"]

volumes:
  pgdata:
